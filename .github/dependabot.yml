version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    # PR title = squash subject; the pr-title check requires build(deps): / build(deps-dev):
    commit-message:
      prefix: build
      include: scope
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # litellm pins openai<3 (see #67); pyproject caps it, so majors would only ever fail.
      - dependency-name: openai
        update-types: ["version-update:semver-major"]
      # Stable kombu pins redis<6.5; anything above only resolves via the
      # kombu 5.7.0a1 pre-release (#78). pyproject caps it too.
      - dependency-name: redis
        versions: [">=6.5"]
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    # PR title = squash subject; the pr-title check requires build(deps): / build(deps-dev):
    commit-message:
      prefix: build
      include: scope
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.x accepts typescript <6.1 only (#71); lift when it supports 7.
      - dependency-name: typescript
        versions: [">=6.1"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # PR title = squash subject; the pr-title check requires build(deps): / build(deps-dev):
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        update-types: [minor, patch, major]
