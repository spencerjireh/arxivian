# Install once: `uvx pre-commit install`. Needs uv and Node 22 (frontend/.nvmrc) on the host,
# plus `cd frontend && npm ci` for the lint-staged hook.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock\.json$|uv\.lock$

  - repo: local
    hooks:
      # Backend: the ruff pinned in backend/uv.lock, so the hook, `just lint` and CI can never
      # disagree on a version. --only-group dev keeps the host venv to the dev tools.
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --project backend --frozen --only-group dev ruff check --fix --force-exclude
        language: system
        types: [python]
        files: ^backend/(src|tests|alembic|scripts)/
      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --project backend --frozen --only-group dev ruff format --force-exclude
        language: system
        types: [python]
        files: ^backend/(src|tests|alembic|scripts)/
      # Frontend: eslint --fix + prettier on the staged files only (config in package.json).
      - id: lint-staged-frontend
        name: lint-staged (frontend)
        entry: bash -c 'cd frontend && npx lint-staged'
        language: system
        files: ^frontend/.*\.(ts|tsx|css|md|json)$
        pass_filenames: false
