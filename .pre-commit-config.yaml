repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock\.json$|uv\.lock$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.9
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/(src|tests|alembic)/
      - id: ruff-format
        files: ^backend/(src|tests|alembic)/

  - repo: local
    hooks:
      # eslint --fix + prettier on the staged frontend files only (config in package.json)
      - id: lint-staged-frontend
        name: lint-staged (frontend)
        entry: bash -c 'cd frontend && npx lint-staged'
        language: system
        files: ^frontend/.*\.(ts|tsx|css|md|json)$
        pass_filenames: false
