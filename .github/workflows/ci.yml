name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests import the app (which instantiates Settings) and mock all downstream
      # network calls, so these dummies never make a real request. CLERK_DOMAIN is the
      # only field without a default; the provider keys let the happy-path health
      # check report healthy instead of degraded.
      CLERK_DOMAIN: test.clerk.accounts.dev
      OPENAI_API_KEY: ci-dummy-key
      JINA_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check src/ tests/ alembic/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ alembic/

      - name: Type check
        run: uv run ty check src/

      - name: Unit tests
        run: uv run pytest tests/unit -m unit -v

      - name: API tests
        run: uv run pytest tests/api -m api -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint + knip
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript check
        run: npm run typecheck

      - name: Tests
        run: npm test
