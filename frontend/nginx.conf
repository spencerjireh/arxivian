worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Docker's embedded DNS. Without this nginx resolves a proxy_pass hostname once, at
    # config load, and caches it for the process lifetime -- so an `app` container that
    # restarts onto a new IP is proxied to a dead address until nginx itself restarts.
    # That is a silent outage: static files keep serving while every /api/ call 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # A variable in proxy_pass is what forces re-resolution per request. depends_on
        # cannot substitute for it: on a host reboot the Docker daemon restarts containers
        # by restart policy and ignores depends_on, which only the compose CLI honours.
        set $app_upstream "app:8000";

        # Self-hosted fonts -- immutable cache
        location /fonts/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Hash-busted Vite assets -- immutable cache
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # SPA fallback -- revalidate on every visit for fresh deploys
        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri $uri/ /index.html;
        }

        # SSE streaming endpoint - disable buffering for real-time events
        location /api/stream {
            proxy_pass http://$app_upstream/api/v1/stream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            chunked_transfer_encoding on;
        }

        location /api/ {
            # Explicit because proxy_pass carries a variable: nginx no longer appends the
            # location remainder itself. The original query string is preserved, since the
            # replacement has none.
            rewrite ^/api/(.*)$ /api/v1/$1 break;
            proxy_pass http://$app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
