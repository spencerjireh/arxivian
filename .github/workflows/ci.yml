name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, production]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are superseded by a newer push. A push to main is the one run that
  # refreshes the GHA docker cache, so it must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tests import the app (which instantiates Settings) and mock all downstream network
  # calls, so these dummies never make a real request. CLERK_DOMAIN is the only field
  # without a default; the provider keys let the happy-path health check report healthy.
  CLERK_DOMAIN: test.clerk.accounts.dev
  OPENAI_API_KEY: ci-dummy-key

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - name: Lockfile is current
        run: uv lock --check
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check src/ tests/ alembic/ scripts/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ alembic/ scripts/
      - name: Type check
        run: uv run ty check src/ scripts/
      - name: OpenAPI document matches the code (run `just types` to refresh)
        run: |
          uv run python -m scripts.export_openapi > ../frontend/openapi.json
          git diff --exit-code -- ../frontend/openapi.json

  backend-test:
    name: Backend unit + api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen
      - name: Unit + API tests with coverage gate
        run: >
          uv run pytest tests/unit tests/api -q
          --cov=src --cov-report=xml --cov-report=term-missing:skip-covered
      - name: Coverage summary
        if: always()
        run: |
          total=$(python3 -c "import xml.etree.ElementTree as E; print(round(float(E.parse('coverage.xml').getroot().get('line-rate'))*100, 1))")
          echo "Backend line coverage: ${total}% (gate: fail_under in pyproject.toml)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  backend-integration:
    name: Backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass  # pragma: allowlist secret
          POSTGRES_DB: arxiv_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d arxiv_rag_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/arxiv_rag_test  # pragma: allowlist secret
      TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/arxiv_rag_test  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen
      - name: Migrations round-trip (head, down one, head)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head
      - name: Integration tests
        run: uv run pytest tests/integration -q

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated types match openapi.json (run `just types` to refresh)
        run: |
          npm run types:generate
          git diff --exit-code -- src/types/api.gen.ts
      - name: ESLint + knip
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - name: TypeScript check
        run: npm run typecheck

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Vitest with coverage thresholds
        # shell: bash gives `-o pipefail`; without it the step exits with tee's status
        # and a vitest or coverage-threshold failure is swallowed.
        shell: bash
        run: npm run test:coverage 2>&1 | tee vitest.log
      - name: Coverage summary
        if: always()
        run: |
          echo "Frontend coverage (thresholds in vitest.config.ts):" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(Lines|Statements|Functions|Branches)" vitest.log >> "$GITHUB_STEP_SUMMARY" || true

  docker:
    name: Docker images + coolify compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Coolify compose file interpolates with dummy required vars
        env:
          POSTGRES_PASSWORD: x
          REDIS_PASSWORD: x
          TYPESAFE_API_KEY: x
          OPENAI_API_KEY: x
          CLERK_DOMAIN: x
          CORS_ORIGINS: http://localhost
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_x
          FLOWER_BASIC_AUTH: a:b
        run: docker compose -f docker-compose.coolify.yml config -q
      - name: Build backend image (production target)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: production
          push: false
          cache-from: type=gha,scope=backend
          # Exporting the backend layers (torch, docling) to the GHA cache took 13 of the
          # job's 16 minutes; only the push-to-main run refreshes the cache, PRs read it.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=min,scope=backend' || '' }}
      - name: Build frontend image (production target)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          target: production
          push: false
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=pk_test_x
            VITE_MAINTENANCE_MODE=false
            VITE_LOGFIRE_TOKEN=
            VITE_LOGFIRE_BASE_URL=
          cache-from: type=gha,scope=frontend
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=min,scope=frontend' || '' }}

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conventional-commit title (squash-merge uses it as the commit subject)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|test|chore|refactor|perf|ci|build)(\([a-z0-9-]+\))?: .+$'; then
            echo "::error::PR title must match type(scope): summary, e.g. 'feat(feed): add week selector (SPE-275)'; Dependabot uses build(deps)"
            exit 1
          fi
